<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Mật Thư Bảng - Hàng - Cột | CIPHER_CORE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link rel="shortcut icon" href="BIN KỸ NĂNG-01.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="output.css" rel="stylesheet">
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card { 
            background: rgba(31, 31, 39, 0.92); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 0.65rem !important;
            border-radius: 0.5rem !important;
        }
        @media (min-width: 768px) {
            .glass-card { 
                background: rgba(31, 31, 39, 0.6); 
                backdrop-filter: blur(12px); 
                padding: 1.5rem !important; 
                border-radius: 0.75rem !important;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
        .cipher-glow:focus-within { border-bottom-color: #00f2ff; box-shadow: 0 4px 12px -4px rgba(0, 242, 255, 0.3); }
        .menu-open aside { transform: translateX(0) !important; }
        .logo-glow-card { box-shadow: 0 0 30px rgba(0, 242, 255, 0.4); border: 2px solid rgba(0, 242, 255, 0.6); }
        .diagonal-header {
            background: linear-gradient(to top right, transparent 49.5%, rgba(255,255,255,0.2) 49.5%, rgba(255,255,255,0.2) 50.5%, transparent 50.5%);
        }
    </style>
    <script src="nav.js"></script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-x-hidden">

    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden" id="menuOverlay"></div>

    <aside id="sidebar" class="h-screen w-64 fixed left-0 top-0 -translate-x-full md:translate-x-0 flex flex-col bg-surface-container-low/90 backdrop-blur-xl border-r border-white/10 shadow-2xl pt-8 pb-8 z-40 transition-transform duration-300 overflow-y-auto">
    <div id="sidebar-container" class="flex flex-col h-full"></div>
</aside>

    <main class="md:pl-64 pt-1 md:pt-6 min-h-screen w-full">
        <div class="px-1 md:px-8 py-1 md:py-8 max-w-container-max mx-auto flex flex-col gap-1.5 md:gap-6">
            
            <header class="mb-1 md:mb-4 flex flex-col sm:flex-row sm:items-end justify-between gap-2">
                <div>
                    <div class="flex items-center gap-2 md:gap-3">
                        <button class="material-symbols-outlined block md:hidden text-primary transition-colors active:scale-95 text-2xl md:text-3xl" id="menuToggle">menu</button>
                        <h1 class="font-display-lg text-lg md:text-5xl font-bold text-primary tracking-wide">MẬT THƯ BẢNG - HÀNG - CỘT</h1>
                    </div>
                </div>
            </header>

            <div id="subnav-container" data-subnav="thaythe"></div>

            <div id="blockModule" class="w-full flex flex-col gap-1.5 md:gap-6">
                
                <div class="glass-card flex flex-col relative">
                    <div class="flex items-center justify-between mb-1">
                        <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold">
                            <span class="material-symbols-outlined text-sm md:text-base">pin</span> BẢN TIN MÃ BẢNG - HÀNG - CỘT CẦN GIẢI
                        </h2>
                        <button class="px-2 py-0.5 bg-white/5 hover:bg-white/10 rounded font-label-md text-[10px] md:text-xs tracking-wider font-bold text-primary" id="btnViewBlockRaw">XEM GỐC</button>
                    </div>
                    <textarea class="w-full bg-transparent border-none border-b border-outline-variant focus:ring-0 focus:border-primary text-sm md:text-xl text-on-surface py-1 cipher-glow h-14 md:min-h-[80px] resize-none font-medium font-mono-data" id="inputBlockText" placeholder="Nhập mã (VD: 1-1-1 1-2-3 hoặc Phật-Pháp-Tăng)..." autocomplete="off" spellcheck="false"></textarea>
                </div>

                <div class="glass-card flex flex-col w-full">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold">
                            <span class="material-symbols-outlined text-sm md:text-base">grid_on</span> SƠ ĐỒ BẢNG - HÀNG - CỘT TỰ ĐỘNG FILL
                        </h2>
                        <span class="text-[10px] text-primary/80 font-bold bg-primary/10 px-2 py-0.5 rounded border border-primary/30">Chạm Tiêu đề/Ô để đổi Tên nhãn hoặc Chữ</span>
                    </div>
                    <div class="w-full bg-black/40 border border-white/5 rounded-lg p-1.5 md:p-3 overflow-x-auto" id="blockGridContainer"></div>
                </div>

                <div class="glass-card flex flex-col">
                    <div class="flex items-center justify-between mb-1">
                        <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold">
                            <span class="material-symbols-outlined text-sm md:text-base">lock_open</span> KẾT QUẢ GIẢI MÃ (BẢNG ➔ HÀNG ➔ CỘT)
                        </h2>
                        <button class="px-2 py-0.5 bg-white/5 hover:bg-white/10 rounded font-label-md text-[10px] md:text-xs tracking-wider font-bold text-primary" id="btnViewBlockOutput">XEM</button>
                    </div>
                    <div class="p-3 bg-black/40 border border-white/5 rounded-lg font-mono-data text-base md:text-2xl text-primary font-bold tracking-wider break-all" id="blockOutputText">-</div>
                </div>

            </div>

        </div>
    </main>

    <!-- MODAL POPUP EDIT NHÃN & CHỮ -->
    <div class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 hidden backdrop-blur-md transition-all duration-300" id="editModal">
        <div class="bg-surface-container-high border border-primary/40 rounded-2xl w-full max-w-md p-5 flex flex-col gap-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/10 pb-2">
                <h3 class="text-xs md:text-sm font-bold uppercase tracking-wider text-primary flex items-center gap-2" id="editModalTitle">CHỈNH SỬA</h3>
                <button id="btnEditClose" class="text-on-surface-variant hover:text-white"><span class="material-symbols-outlined text-base">close</span></button>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-on-surface-variant font-bold" id="editModalLabel">Nhập giá trị mới:</label>
                <input type="text" id="editModalInput" class="w-full bg-surface-container-highest border border-primary/50 rounded-xl p-3 text-center text-primary font-bold text-lg md:text-xl uppercase outline-none focus:ring-2 focus:ring-primary/50" autocomplete="off">
            </div>
            <div class="flex items-center justify-end gap-2 pt-1">
                <button id="btnEditCancel" class="px-4 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-bold text-on-surface-variant">HỦY BỎ</button>
                <button id="btnEditSave" class="px-5 py-2 bg-primary text-background rounded-xl text-xs font-black uppercase tracking-wider hover:brightness-110 active:scale-95 transition-all">LƯU CẬP NHẬT</button>
            </div>
        </div>
    </div>

    <!-- Modal Box Xem Chi Tiết -->
    <div class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 hidden backdrop-blur-md transition-all duration-300" id="infoModal">
        <div class="bg-surface-container-high border border-primary/30 rounded-2xl w-full max-w-2xl p-6 flex flex-col shadow-2xl">
            <div class="flex-1 max-h-[60vh] overflow-y-auto text-on-background text-xl md:text-2xl font-mono-data p-4 md:p-6 break-all leading-loose tracking-widest bg-black/30 rounded-xl text-center" id="modalBody"></div>
            <button class="w-full mt-4 bg-primary text-background font-bold p-3 rounded-xl hover:brightness-110 active:scale-95 transition-all text-sm uppercase tracking-widest font-bold" id="btnClose">ĐÓNG WINDOWS</button>
        </div>
    </div>

    <script>
        const menuOverlay = document.getElementById('menuOverlay');
        const menuToggle = document.getElementById('menuToggle');
        menuToggle.onclick = (e) => { document.body.classList.add('menu-open'); menuOverlay.classList.remove('hidden'); e.stopPropagation(); }
        menuOverlay.onclick = () => { document.body.classList.remove('menu-open'); menuOverlay.classList.add('hidden'); }

        const editModal = document.getElementById('editModal');
        const editModalTitle = document.getElementById('editModalTitle');
        const editModalLabel = document.getElementById('editModalLabel');
        const editModalInput = document.getElementById('editModalInput');
        const btnEditClose = document.getElementById('btnEditClose');
        const btnEditCancel = document.getElementById('btnEditCancel');
        const btnEditSave = document.getElementById('btnEditSave');

        let onEditSaveCallback = null;

        function openCustomEditModal(title, label, defaultValue, callback) {
            editModalTitle.innerText = title;
            editModalLabel.innerText = label;
            editModalInput.value = defaultValue || '';
            onEditSaveCallback = callback;
            editModal.classList.remove('hidden');
            setTimeout(() => { editModalInput.focus(); editModalInput.select(); }, 100);
        }

        function closeCustomEditModal() {
            editModal.classList.add('hidden');
            onEditSaveCallback = null;
        }

        btnEditClose.onclick = closeCustomEditModal;
        btnEditCancel.onclick = closeCustomEditModal;
        btnEditSave.onclick = () => {
            if (onEditSaveCallback) onEditSaveCallback(editModalInput.value.trim());
            closeCustomEditModal();
        };

        editModalInput.onkeydown = (e) => {
            if (e.key === 'Enter') btnEditSave.click();
            else if (e.key === 'Escape') closeCustomEditModal();
        };

        const inputBlockText = document.getElementById('inputBlockText');
        const blockGridContainer = document.getElementById('blockGridContainer');
        const blockOutputText = document.getElementById('blockOutputText');

        const alphabetList = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        
        let blockLabelsArr = ["1", "2", "3"];
        let rowLabelsArr = ["1", "2", "3"];
        let colLabelsArr = ["1", "2", "3"];

        let selectedStartB = 0;
        let selectedStartR = 0;
        let selectedStartC = 0;
        let selectedStartChar = 'A';

        let currentBlockMap = {};

        function renderBlockMatrix() {
            let matrix3D = Array.from({ length: 3 }, () => Array.from({ length: 3 }, () => Array(3).fill('')));
            currentBlockMap = {};

            let startCharIdx = alphabetList.indexOf(selectedStartChar);
            if (startCharIdx === -1) startCharIdx = 0;

            let curB = selectedStartB, curR = selectedStartR, curC = selectedStartC;

            for (let i = 0; i < 27; i++) {
                let char = (i < 26) ? alphabetList[(startCharIdx + i) % 26] : '⊕';
                matrix3D[curB][curR][curC] = char;

                let bKey = blockLabelsArr[curB];
                let rKey = rowLabelsArr[curR];
                let cKey = colLabelsArr[curC];

                currentBlockMap[`${bKey}-${rKey}-${cKey}`] = char;
                currentBlockMap[`${bKey}${rKey}${cKey}`] = char;
                currentBlockMap[`${curB+1}${curR+1}${curC+1}`] = char;

                curC++;
                if (curC >= 3) {
                    curC = 0;
                    curR++;
                    if (curR >= 3) {
                        curR = 0;
                        curB = (curB + 1) % 3;
                    }
                }
            }

            let tableHtml = `<table class="w-full border-collapse text-center font-mono-data border border-white/20 table-fixed">
                <thead>
                    <tr class="border-b border-white/20">
                        <th colspan="2" class="p-2 border-r border-white/20 font-black text-sm uppercase tracking-widest text-primary diagonal-header"></th>
                        <th colspan="9" class="p-2 font-black text-base uppercase tracking-widest text-primary bg-primary/10">BẢNG</th>
                    </tr>
                    <tr class="border-b border-white/20 bg-black/40">
                        <th colspan="2" class="p-1 border-r border-white/20"></th>
                        <th colspan="3" class="th-block-hdr p-1.5 border-r border-white/20 font-bold text-xs md:text-sm text-primary hover:bg-primary/20 cursor-pointer transition-all truncate" data-b="0">${blockLabelsArr[0]}</th>
                        <th colspan="3" class="th-block-hdr p-1.5 border-r border-white/20 font-bold text-xs md:text-sm text-primary hover:bg-primary/20 cursor-pointer transition-all truncate" data-b="1">${blockLabelsArr[1]}</th>
                        <th colspan="3" class="th-block-hdr p-1.5 font-bold text-xs md:text-sm text-primary hover:bg-primary/20 cursor-pointer transition-all truncate" data-b="2">${blockLabelsArr[2]}</th>
                    </tr>
                </thead>
                <tbody>`;

            for (let r = 0; r < 3; r++) {
                tableHtml += `<tr class="border-b border-white/10">`;
                if (r === 0) {
                    tableHtml += `<td rowspan="3" class="p-1 border-r border-white/20 font-black text-xs md:text-sm uppercase tracking-wider text-error bg-error/10 w-12 text-center" style="writing-mode: vertical-rl; transform: rotate(180deg);">HÀNG</td>`;
                }
                tableHtml += `<td class="td-row-hdr p-1.5 border-r border-white/20 font-bold text-xs md:text-sm text-error bg-error/5 hover:bg-error/20 cursor-pointer transition-all w-12 truncate" data-r="${r}">${rowLabelsArr[r]}</td>`;

                for (let b = 0; b < 3; b++) {
                    for (let c = 0; c < 3; c++) {
                        let isStart = (b === selectedStartB && r === selectedStartR && c === selectedStartC);
                        let cellChar = matrix3D[b][r][c];
                        let borderR = (c === 2) ? 'border-r-2 border-r-white/30' : 'border-r border-white/10';
                        let cellClass = isStart ? 'bg-primary text-background font-black scale-100 shadow-md ring-2 ring-primary' : 'bg-black/20 text-on-surface font-bold hover:bg-white/10 cursor-pointer';
                        tableHtml += `<td class="cell-block p-2 md:p-3 ${borderR} text-sm md:text-lg ${cellClass} transition-all" data-b="${b}" data-r="${r}" data-c="${c}">${cellChar}</td>`;
                    }
                }
                tableHtml += `</tr>`;
            }

            tableHtml += `<tr class="bg-black/40 border-t border-white/20">
                <td colspan="2" class="p-1.5 border-r border-white/20 font-black text-xs md:text-sm uppercase text-secondary bg-secondary/10">CỘT</td>`;
            for (let b = 0; b < 3; b++) {
                for (let c = 0; c < 3; c++) {
                    let borderR = (c === 2) ? 'border-r-2 border-r-white/30' : 'border-r border-white/10';
                    tableHtml += `<td class="td-col-hdr p-1.5 ${borderR} font-bold text-xs text-secondary bg-secondary/5 hover:bg-secondary/20 cursor-pointer transition-all truncate" data-c="${c}">${colLabelsArr[c]}</td>`;
                }
            }
            tableHtml += `</tr></tbody></table>`;

            blockGridContainer.innerHTML = tableHtml;

            blockGridContainer.querySelectorAll('.th-block-hdr').forEach(th => {
                th.onclick = () => {
                    let b = parseInt(th.getAttribute('data-b'));
                    openCustomEditModal("ĐỔI TÊN BẢNG " + (b + 1), "Nhập tên nhãn mới cho Bảng:", blockLabelsArr[b], (val) => {
                        if (val) {
                            blockLabelsArr[b] = val.toUpperCase();
                            renderBlockMatrix();
                        }
                    });
                };
            });

            blockGridContainer.querySelectorAll('.td-row-hdr').forEach(td => {
                td.onclick = () => {
                    let r = parseInt(td.getAttribute('data-r'));
                    openCustomEditModal("ĐỔI TÊN HÀNG " + (r + 1), "Nhập tên nhãn mới cho Hàng:", rowLabelsArr[r], (val) => {
                        if (val) {
                            rowLabelsArr[r] = val.toUpperCase();
                            renderBlockMatrix();
                        }
                    });
                };
            });

            blockGridContainer.querySelectorAll('.td-col-hdr').forEach(td => {
                td.onclick = () => {
                    let c = parseInt(td.getAttribute('data-c'));
                    openCustomEditModal("ĐỔI TÊN CỘT " + (c + 1), "Nhập tên nhãn mới cho Cột:", colLabelsArr[c], (val) => {
                        if (val) {
                            colLabelsArr[c] = val.toUpperCase();
                            renderBlockMatrix();
                        }
                    });
                };
            });

            blockGridContainer.querySelectorAll('.cell-block').forEach(cell => {
                cell.onclick = () => {
                    let b = parseInt(cell.getAttribute('data-b'));
                    let r = parseInt(cell.getAttribute('data-r'));
                    let c = parseInt(cell.getAttribute('data-c'));
                    openCustomEditModal("VỊ TRÍ BẮT ĐẦU", `Chữ cái xuất phát tại Ô [Bảng: ${blockLabelsArr[b]} - Hàng: ${rowLabelsArr[r]} - Cột: ${colLabelsArr[c]}]:`, selectedStartChar, (val) => {
                        if (val) {
                            let cleanChar = val.toUpperCase().replace(/[^A-Z]/g, '');
                            if (cleanChar.length > 0) {
                                selectedStartChar = cleanChar[0];
                                selectedStartB = b;
                                selectedStartR = r;
                                selectedStartC = c;
                                renderBlockMatrix();
                            }
                        }
                    });
                };
            });

            solveBlockCipher();
        }

        function solveBlockCipher() {
            const rawText = inputBlockText.value.trim();
            if (!rawText) {
                if (blockOutputText) blockOutputText.innerText = "-";
                return;
            }

            const tokens = rawText.split(/[\s,\/]+/).filter(t => t.length > 0);
            let decoded = "";

            function parseBlockToken(token) {
                let clean = token.toUpperCase();
                if (clean.includes('-')) {
                    let parts = clean.split('-').map(p => p.trim());
                    if (parts.length === 3) return `${parts[0]}-${parts[1]}-${parts[2]}`;
                }
                for (let b of blockLabelsArr) {
                    if (clean.startsWith(b)) {
                        let rem1 = clean.substring(b.length);
                        for (let r of rowLabelsArr) {
                            if (rem1.startsWith(r)) {
                                let c = rem1.substring(r.length);
                                if (colLabelsArr.includes(c)) return `${b}-${r}-${c}`;
                            }
                        }
                    }
                }
                return null;
            }

            tokens.forEach(token => {
                let cleanToken = token.toUpperCase();

                if (cleanToken === '/' || cleanToken === '||') {
                    decoded += " ";
                    return;
                }

                let keyKey = parseBlockToken(cleanToken);
                if (keyKey && currentBlockMap[keyKey]) {
                    decoded += currentBlockMap[keyKey];
                }
            });

            if (blockOutputText) blockOutputText.innerText = decoded.trim() || "-";
        }

        if (inputBlockText) inputBlockText.addEventListener('input', solveBlockCipher);

        const modal = document.getElementById('infoModal');
        const modalBody = document.getElementById('modalBody');
        const btnViewBlockRaw = document.getElementById('btnViewBlockRaw');
        const btnViewBlockOutput = document.getElementById('btnViewBlockOutput');

        if (btnViewBlockRaw) {
            btnViewBlockRaw.onclick = () => {
                if (modalBody) modalBody.innerText = inputBlockText.value || "Trống";
                if (modal) modal.classList.remove('hidden');
            };
        }
        if (btnViewBlockOutput) {
            btnViewBlockOutput.onclick = () => {
                if (modalBody) modalBody.innerText = blockOutputText.innerText || "-";
                if (modal) modal.classList.remove('hidden');
            };
        }
        document.getElementById('btnClose').onclick = () => modal.classList.add('hidden');
        modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.add('hidden'); });

        renderBlockMatrix();
    </script>
</body>
</html>
