<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Mật Thư Dời Chỗ - Cam Ranh Studio | CIPHER_CORE</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link rel="shortcut icon" href="BIN KỸ NĂNG-01.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link href="output.css" rel="stylesheet">
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        .glass-card { 
            background: rgba(31, 31, 39, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 0.65rem !important;
            border-radius: 0.5rem !important;
        }
        @media (min-width: 768px) {
            .glass-card { 
                padding: 1.5rem !important; 
                border-radius: 0.75rem !important;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        .cipher-glow:focus-within { border-bottom-color: #00f2ff; box-shadow: 0 4px 12px -4px rgba(0, 242, 255, 0.3); }
        .menu-open aside { transform: translateX(0) !important; }
        .logo-glow-card { box-shadow: 0 0 30px rgba(0, 242, 255, 0.4); border: 2px solid rgba(0, 242, 255, 0.6); }

        /* Định dạng bảng ma trận Cam Ranh */
        .matrix-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .matrix-table th, .matrix-table td {
            border: 1px solid rgba(255,255,255,0.12);
            text-align: center;
            padding: 6px 2px;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(10px, 2.5vw, 14px);
        }
        .th-char { color: #00f2ff; font-weight: 800; background: rgba(0, 242, 255, 0.1); }
        .th-num { color: #ff0080; background: rgba(255, 0, 128, 0.15); font-weight: 800; }
        .matrix-table td { 
            background: rgba(0,0,0,0.3); 
            color: #e4e1ed; 
            font-weight: 600; 
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .matrix-table td.cell-active {
            background-color: rgba(0, 242, 255, 0.25) !important;
            color: #00f2ff !important;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.6);
            font-weight: 900;
        }
    </style>
    
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-x-hidden">

    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden" id="menuOverlay"></div>

    <!-- SIDEBAR NAVIGATION TỰ ĐỘNG RENDER TỪ nav.js -->
    <aside id="sidebar" class="h-screen w-64 fixed left-0 top-0 -translate-x-full md:translate-x-0 flex flex-col bg-surface-container-low/90 backdrop-blur-xl border-r border-white/10 shadow-2xl pt-8 pb-8 z-40 transition-transform duration-300 overflow-y-auto">
        <div id="sidebar-container" class="flex flex-col h-full"></div>
    </aside>

    <!-- MAIN CANVAS -->
    <main class="md:pl-64 pt-1 md:pt-6 min-h-screen w-full">
        <div class="px-1 md:px-8 py-1 md:py-8 max-w-container-max mx-auto flex flex-col gap-1.5 md:gap-6">
            
            <header class="mb-1 md:mb-4 flex flex-col sm:flex-row sm:items-end justify-between gap-2">
                <div>
                    <div class="flex items-center gap-2 md:gap-3">
                        <button class="material-symbols-outlined block md:hidden text-primary transition-colors active:scale-95 text-2xl md:text-3xl" id="menuToggle">menu</button>
                        <h1 class="font-display-lg text-lg md:text-5xl font-bold text-primary tracking-wide">MẬT THƯ DỜI CHỖ</h1>
                    </div>
                </div>
            </header>

            <!-- Dropdown Item 1 / Item 2 tự động render từ nav.js -->
            <div id="subnav-container" data-subnav="camranh"></div>

            <div class="flex flex-col lg:grid lg:grid-cols-12 gap-1.5 md:gap-6">
                
                <!-- CỘT ĐIỀU KHIỂN & CẤU HÌNH -->
                <section class="order-1 lg:order-2 lg:col-span-4 flex flex-col gap-1.5 md:gap-6">
                    <div id="replacementControls" class="glass-card flex flex-col gap-2 md:gap-4">
                        <div class="flex items-center justify-between">
                            <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold">
                                <span class="material-symbols-outlined text-sm md:text-base">tune</span> CẤU HÌNH KHÓA
                            </h2>
                            <button id="btnClear" class="text-error/70 hover:text-error flex items-center gap-1 text-[10px] md:text-[11px] font-bold uppercase tracking-widest active:scale-95 transition-all">
                                <span class="material-symbols-outlined text-xs font-bold">delete_sweep</span>
                                <span class="hidden sm:inline">XÓA TRẮNG</span>
                                <span class="inline sm:hidden">CLEAR</span>
                            </button>
                        </div>

                        <div class="flex flex-col gap-1.5 md:gap-3 mt-1">
                            <label class="text-[10px] md:text-xs font-label-md text-on-surface-variant font-bold uppercase tracking-wider block">NHẬP KHÓA (VÍ DỤ: TỔ QUỐC)</label>
                            <input type="text" id="inputKey" class="w-full bg-surface-container-highest border border-primary/40 rounded-lg p-2 md:p-3 font-bold text-sm md:text-lg text-primary focus:ring-1 focus:ring-primary outline-none uppercase tracking-wider" placeholder="TỔ QUỐC..." value="TỔ QUỐC" autocomplete="off" spellcheck="false">
                        </div>
                    </div>
                </section>
                
                <!-- CỘT CHỨA VĂN BẢN VÀ KẾT QUẢ MA TRẬN -->
                <section class="order-2 lg:order-1 lg:col-span-8 flex flex-col gap-1.5 md:gap-6">
                    <!-- Khung Nhập Liệu Bạch Văn -->
                    <div class="glass-card flex flex-col relative">
                        <div class="flex items-center justify-between mb-1">
                            <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold">
                                <span class="material-symbols-outlined text-sm md:text-base">keyboard</span> BẠCH VĂN (NGĂN CÁCH BỞI KÝ TỰ LẠ)
                            </h2>
                            <button class="px-2 py-0.5 bg-white/5 hover:bg-white/10 rounded font-label-md text-[10px] md:text-xs tracking-wider font-bold text-primary" id="btnViewRaw">XEM GỐC</button>
                        </div>
                        <textarea class="w-full bg-transparent border-none border-b border-outline-variant focus:ring-0 focus:border-primary text-sm md:text-xl text-on-surface py-1 cipher-glow h-14 md:min-h-[100px] resize-none font-medium" id="inputText" placeholder="CỤM 1 / CỤM 2 / CỤM 3..." autocomplete="off" spellcheck="false"></textarea>
                    </div>

                    <!-- Khung Ma Trận Dời Chỗ -->
                    <div class="glass-card flex flex-col">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold" id="gridTitle">
                                <span class="material-symbols-outlined text-sm md:text-base">table_chart</span> MA TRẬN DỜI CHỖ (CAM RANH)
                            </h2>
                        </div>
                        <div class="w-full overflow-x-auto bg-black/40 border border-white/5 rounded-lg p-2" id="tableGrid">
                            <div class="text-center text-xs text-on-surface-variant font-mono-data py-4">- Hãy nhập khóa và văn bản để dựng ma trận -</div>
                        </div>
                    </div>

                    <!-- KHỐI XUẤT HÀNG LOẠT TRƯỜNG HỢP CHỮ SINH RA -->
                    <div class="glass-card flex flex-col">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold">
                                <span class="material-symbols-outlined text-sm md:text-base">alt_route</span> CÁC TRƯỜNG HỢP CHỮ ĐẦU RA (TẤT CẢ QUY LUẬT)
                            </h2>
                        </div>
                        <div class="flex flex-col gap-2" id="patternsOutput">
                            <div class="text-center text-xs text-on-surface-variant font-mono-data py-2">- Chưa có dữ liệu ma trận -</div>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- Modal Box Xem Chi Tiết Popup -->
    <div class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 hidden backdrop-blur-md transition-all duration-300" id="infoModal">
        <div class="bg-surface-container-high border border-primary/30 rounded-2xl w-full max-w-2xl p-6 flex flex-col shadow-2xl">
            <div class="text-xs font-bold uppercase tracking-widest text-primary mb-2 text-center" id="modalTitle">NỘI DUNG MẬT THƯ</div>
            <div class="flex-1 max-h-[60vh] overflow-y-auto text-on-background text-xl md:text-2xl font-mono-data p-4 md:p-6 break-all leading-loose tracking-widest bg-black/30 rounded-xl text-center text-primary font-bold" id="modalBody"></div>
            <button class="w-full mt-4 bg-primary text-background font-bold p-3 rounded-xl hover:brightness-110 active:scale-95 transition-all text-sm uppercase tracking-widest" id="btnClose">ĐÓNG WINDOWS</button>
        </div>
    </div>

    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
        <div class="absolute top-[20%] right-[10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[5%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-[100px]"></div>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const overlay = document.getElementById('menuOverlay');

        menuToggle.onclick = (e) => { document.body.classList.add('menu-open'); overlay.classList.remove('hidden'); e.stopPropagation(); }
        overlay.onclick = () => { document.body.classList.remove('menu-open'); overlay.classList.add('hidden'); }

        const inputKey = document.getElementById('inputKey');
        const inputText = document.getElementById('inputText');
        const tableGrid = document.getElementById('tableGrid');
        const patternsOutput = document.getElementById('patternsOutput');

        const telexMap = { 'à':'a','á':'a','ả':'a','ã':'a','ạ':'a','ằ':'aw','ắ':'aw','ẳ':'aw','ẵ':'aw','ặ':'aw','ầ':'aa','ấ':'aa','ẩ':'aa','ẫ':'aa','ậ':'aa','è':'e','é':'e','ẻ':'e','ẽ':'e','ẹ':'e','ề':'ee','ế':'ee','ể':'ee','ễ':'ee','ệ':'ee','ì':'i','í':'i','ỉ':'i','ĩ':'i','ị':'i','ò':'o','ó':'o','ỏ':'o','õ':'o','ọ':'o','ồ':'oo','ố':'oo','ổ':'oo','ỗ':'oo','ộ':'oo','ờ':'ow','ớ':'ow','ở':'ow','ỡ':'ow','ợ':'ow','ù':'u','ú':'u','ủ':'u','ũ':'u','ụ':'u','ừ':'uw','ứ':'uw','ử':'uw','ữ':'uw','ự':'uw','ỳ':'y','ý':'y','ỷ':'y','ỹ':'y','ỵ':'y','đ':'dd','â':'aa','ă':'aw','ê':'ee','ô':'oo','ơ':'ow','ư':'uw' };
        const toneMap = { 'á':'s','à':'f','ả':'r','ã':'x','ạ':'j','ắ':'s','ằ':'f','ẳ':'r','ẵ':'x','ặ':'j','ấ':'s','ầ':'f','ẩ':'r','ẫ':'x','ậ':'j','é':'s','è':'f','ẻ':'r','ẽ':'x','ẹ':'j','ế':'s','ề':'f','ể':'r','ễ':'x','ệ':'j','í':'s','ì':'f','ỉ':'r','ĩ':'x','ị':'j','ó':'s','ò':'f','ỏ':'r','õ':'x','ọ':'j','ố':'s','ồ':'f','ổ':'r','ỗ':'x','ộ':'j','ớ':'s','ờ':'f','ở':'r','ỡ':'x','ợ':'j','ú':'s','ù':'f','ủ':'r','ũ':'x','ụ':'j','ứ':'s','ừ':'f','ử':'r','ữ':'x','ự':'j','ý':'s','ỳ':'f','ỷ':'r','ỹ':'x','ỵ':'j' };

        function toTelexArray(str) {
            let result = []; const words = str.trim().toLowerCase().split(/\s+/);
            if(!str.trim()) return [];
            words.forEach(word => {
                let newWordChars = [], tones = "";
                for (let char of word) {
                    if (telexMap[char]) newWordChars.push(...telexMap[char].split(''));
                    else if(/[a-z0-9]/.test(char)) newWordChars.push(char);
                    if (toneMap[char]) tones += toneMap[char];
                }
                result.push(...newWordChars, ...tones.split(''));
            });
            return result;
        }

        function generatePatterns(matrix) {
            const R = matrix.length;
            if (R === 0) return [];
            const C = matrix[0].length;
            if (C === 0) return [];

            let list = [];

            let th1 = "";
            for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (matrix[r][c]) th1 += matrix[r][c];
            list.push({ title: "TH1: Trái ➔ Phải (Từ Trên ➔ Dưới)", text: th1 });

            let th2 = "";
            for (let r = 0; r < R; r++) for (let c = C - 1; c >= 0; c--) if (matrix[r][c]) th2 += matrix[r][c];
            list.push({ title: "TH2: Phải ➔ Trái (Từ Trên ➔ Dưới)", text: th2 });

            let th3 = "";
            for (let r = 0; r < R; r++) {
                if (r % 2 === 0) { for (let c = 0; c < C; c++) if (matrix[r][c]) th3 += matrix[r][c]; }
                else { for (let c = C - 1; c >= 0; c--) if (matrix[r][c]) th3 += matrix[r][c]; }
            }
            list.push({ title: "TH3: Zigzag Ziczac (Trên ➔ Dưới: Trái-Phải / Phải-Trái)", text: th3 });

            let th4 = "";
            for (let r = 0; r < R; r++) {
                if (r % 2 === 0) { for (let c = C - 1; c >= 0; c--) if (matrix[r][c]) th4 += matrix[r][c]; }
                else { for (let c = 0; c < C; c++) if (matrix[r][c]) th4 += matrix[r][c]; }
            }
            list.push({ title: "TH4: Zigzag Ziczac Ngược (Trên ➔ Dưới: Phải-Trái / Trái-Phải)", text: th4 });

            let th5 = "";
            for (let r = R - 1; r >= 0; r--) for (let c = 0; c < C; c++) if (matrix[r][c]) th5 += matrix[r][c];
            list.push({ title: "TH5: Trái ➔ Phải (Từ Dưới ➔ Trên)", text: th5 });

            let th6 = "";
            for (let r = R - 1; r >= 0; r--) for (let c = C - 1; c >= 0; c--) if (matrix[r][c]) th6 += matrix[r][c];
            list.push({ title: "TH6: Phải ➔ Trái (Từ Dưới ➔ Trên)", text: th6 });

            let th7 = "";
            for (let i = 0; i < R; i++) {
                let r = R - 1 - i;
                if (i % 2 === 0) { for (let c = 0; c < C; c++) if (matrix[r][c]) th7 += matrix[r][c]; }
                else { for (let c = C - 1; c >= 0; c--) if (matrix[r][c]) th7 += matrix[r][c]; }
            }
            list.push({ title: "TH7: Zigzag Ziczac (Dưới ➔ Trên: Trái-Phải / Phải-Trái)", text: th7 });

            let th8 = "";
            for (let i = 0; i < R; i++) {
                let r = R - 1 - i;
                if (i % 2 === 0) { for (let c = C - 1; c >= 0; c--) if (matrix[r][c]) th8 += matrix[r][c]; }
                else { for (let c = 0; c < C; c++) if (matrix[r][c]) th8 += matrix[r][c]; }
            }
            list.push({ title: "TH8: Zigzag Ziczac Ngược (Dưới ➔ Trên: Phải-Trái / Trái-Phải)", text: th8 });

            return list;
        }

        function solve() {
            const rawKey = inputKey.value.trim();
            const rawText = inputText.value.trim();
            
            if (!rawKey || !rawText) { 
                tableGrid.innerHTML = '<div class="text-center text-xs text-on-surface-variant font-mono-data py-4">- Hãy nhập khóa và văn bản để dựng ma trận -</div>'; 
                patternsOutput.innerHTML = '<div class="text-center text-xs text-on-surface-variant font-mono-data py-2">- Chưa có dữ liệu ma trận -</div>';
                return; 
            }

            const keyChars = toTelexArray(rawKey).map(c => c.toUpperCase());
            if (keyChars.length === 0) return;
            
            let sortedInfo = keyChars.map((char, index) => ({ char, index }));
            sortedInfo.sort((a, b) => a.char.localeCompare(b.char) || a.index - b.index);
            let keyOrder = new Array(keyChars.length);
            sortedInfo.forEach((item, i) => { keyOrder[item.index] = i + 1; });

            const columns = rawText.split(/[^a-zA-Z0-9]+/).filter(c => c.length > 0);
            let maxRows = Math.max(...columns.map(c => c.length), 1);
            let matrix = Array.from({ length: maxRows }, () => new Array(keyChars.length).fill(''));

            columns.forEach((colText, index) => {
                if (index < keyChars.length) {
                    let colPos = keyOrder.indexOf(index + 1);
                    for (let r = 0; r < colText.length; r++) {
                        matrix[r][colPos] = colText[r].toUpperCase();
                    }
                }
            });

            let html = '<table class="matrix-table"><thead><tr>';
            keyChars.forEach(c => html += `<th class="th-char">${c}</th>`);
            html += '</tr><tr>';
            keyOrder.forEach(n => html += `<th class="th-num">${n}</th>`);
            html += '</tr></thead><tbody>';
            matrix.forEach(row => {
                html += '<tr>';
                row.forEach(cell => html += `<td>${cell || '&nbsp;'}</td>`);
                html += '</tr>';
            });
            html += '</tbody></table>';
            
            tableGrid.innerHTML = html;

            const tableElement = tableGrid.querySelector('.matrix-table');
            if (tableElement) {
                tableElement.onclick = (e) => {
                    const cell = e.target.closest('td');
                    if (cell) cell.classList.toggle('cell-active');
                };
            }

            const patterns = generatePatterns(matrix);
            let pHtml = "";
            patterns.forEach((p, idx) => {
                pHtml += `
                    <div class="bg-black/30 border border-white/5 rounded-lg p-2 flex flex-col gap-1 hover:border-primary/30 transition-colors">
                        <div class="text-[10px] font-bold text-primary tracking-wider uppercase flex items-center justify-between">
                            <span class="truncate max-w-[80%]">${p.title}</span>
                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                <span class="text-[9px] text-on-surface-variant font-mono-data">#${idx + 1}</span>
                                <button class="btn-view-pattern px-2 py-0.5 bg-primary/10 hover:bg-primary/20 text-primary border border-primary/30 rounded text-[9px] font-bold tracking-wider transition-all active:scale-95 flex items-center gap-1" data-title="${p.title}" data-text="${p.text || '-'}">
                                    <span class="material-symbols-outlined text-[11px] pointer-events-none">visibility</span> XEM
                                </button>
                            </div>
                        </div>
                        <div class="p-1.5 bg-black/40 border border-white/5 rounded font-mono-data text-xs md:text-sm text-on-surface font-bold tracking-widest break-all select-all text-primary/90">${p.text || "-"}</div>
                    </div>
                `;
            });
            patternsOutput.innerHTML = pHtml;
        }

        inputKey.oninput = solve;
        inputText.oninput = solve;

        const modal = document.getElementById('infoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        const openModal = (title, text) => { 
            modalTitle.innerText = title || "NỘI DUNG MẬT THƯ";
            modalBody.innerText = text || "Trống"; 
            modal.classList.remove('hidden'); 
        }

        document.getElementById('btnViewRaw').onclick = () => openModal("BẠCH VĂN GỐC", inputText.value);
        document.getElementById('btnClose').onclick = () => modal.classList.add('hidden');
        modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.add('hidden'); });

        patternsOutput.addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-view-pattern');
            if (btn) {
                openModal(btn.getAttribute('data-title'), btn.getAttribute('data-text'));
            }
        });

        document.getElementById('btnClear').onclick = () => { inputText.value = ""; solve(); };

        solve();
    </script>
    <script src="script_security.js"></script>
    <script src="nav.js"></script>
</body>
</html>
