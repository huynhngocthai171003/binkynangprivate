<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Thử Thách Semaphore | CIPHER_CORE</title>
    
    <link rel="shortcut icon" href="BIN KỸ NĂNG-01.png" type="image/x-icon">
    <!-- MỚI (Tải ngầm, không chặn render): -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" media="print" onload="this.media='all'">
    <link href="output.css" rel="stylesheet">
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        .glass-card { 
            background: rgba(31, 31, 39, 0.92); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 0.65rem !important;
            border-radius: 0.5rem !important;
        }
        @media (min-width: 768px) {
            .glass-card { 
                background: rgba(31, 31, 39, 0.6); 
                backdrop-filter: blur(12px); 
                padding: 1.5rem !important; 
                border-radius: 0.75rem !important;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
        
        .menu-open aside { transform: translateX(0) !important; }
        .logo-glow-card { box-shadow: 0 0 30px rgba(0, 210, 252, 0.4); border: 2px solid rgba(0, 210, 252, 0.6); }
        
        .semaphore-img { 
            width: 100% !important;     
            height: 100% !important;    
            max-width: 380px !important; 
            max-height: 380px !important;
            object-fit: contain;        
            filter: drop-shadow(0 0 16px rgba(0, 210, 252, 0.6)); 
            transition: opacity 0.05s ease-in-out;
        }
    </style>
    
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-x-hidden">

    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden" id="menuOverlay"></div>

    <aside id="sidebar" class="h-screen w-64 fixed left-0 top-0 -translate-x-full md:translate-x-0 flex flex-col bg-surface-container-low/90 backdrop-blur-xl border-r border-white/10 shadow-2xl pt-8 pb-8 z-40 transition-transform duration-300 overflow-y-auto">
    <div id="sidebar-container" class="flex flex-col h-full"></div>
</aside>

    <main class="md:pl-64 pt-1 md:pt-6 min-h-screen w-full">
        <div class="px-1 md:px-8 py-1 md:py-8 max-w-container-max mx-auto flex flex-col gap-1.5 md:gap-6">
            
            <header class="mb-1 md:mb-4 flex flex-col sm:flex-row sm:items-end justify-between gap-2">
                <div>
                    <div class="flex items-center gap-2 md:gap-3">
                        <button class="material-symbols-outlined block md:hidden text-primary transition-colors active:scale-95 text-2xl md:text-3xl" id="menuToggle">menu</button>
                        <h1 class="font-display-lg text-lg md:text-5xl font-bold text-primary tracking-wide">THỬ THÁCH SEMAPHORE</h1>
                    </div>
                </div>
            </header>

            <div id="subnav-container" data-subnav="semaphore"></div>

            <div id="challengeModule" class="flex flex-col lg:grid lg:grid-cols-12 gap-1.5 md:gap-6">
                
                <section class="order-1 lg:order-2 lg:col-span-4 flex flex-col gap-1.5 md:gap-6">
                    <div class="glass-card flex flex-col gap-2 md:gap-4">
                        <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold">
                            <span class="material-symbols-outlined text-sm md:text-base">casino</span> CẤU HÌNH THỬ THÁCH
                        </h2>
                        
                        <div>
                            <label class="text-[10px] md:text-xs font-label-md uppercase text-on-surface-variant block mb-0.5">Số từ mỗi câu hỏi</label>
                            <input type="number" id="challengeWordCountInput" value="3" min="1" max="20" class="w-full bg-surface-container-highest border border-white/10 text-on-surface text-center rounded-lg p-1 md:p-2 text-xs md:text-sm outline-none focus:ring-1 focus:ring-primary"/>
                        </div>

                        <div class="flex flex-col gap-1 p-2 md:p-3 bg-black/20 rounded-lg border border-white/5">
                            <div class="flex justify-between text-[10px] md:text-xs font-mono-data text-on-surface-variant">
                                <span>TỐC ĐỘ PHÁT CỜ:</span>
                                <span id="challengeSpeedVal" class="text-primary font-bold">1.2s</span>
                            </div>
                            <input type="range" id="challengeSpeedRange" min="500" max="2500" step="100" value="1200" dir="rtl" class="w-full accent-primary mt-0.5 cursor-pointer">
                        </div>

                        <hr class="border-white/5 my-0.5">

                        <button id="btnChallengeGenerate" class="w-full py-2.5 md:py-4 bg-primary text-background font-bold rounded-xl flex items-center justify-center gap-1.5 hover:brightness-110 active:scale-[0.98] transition-all text-xs md:text-sm">
                            <span class="material-symbols-outlined text-sm font-bold">shuffle</span> SINH CÂU HỎI MỚI
                        </button>
                        
                        <button id="btnChallengePlay" class="w-full py-2 bg-white/5 border border-white/10 rounded-lg font-semibold text-[11px] md:text-sm hover:bg-white/10 transition-all flex items-center justify-center gap-1.5">
                            <span class="material-symbols-outlined text-sm">visibility</span> PHÁT LẠI TÍN HIỆU CỜ
                        </button>
                    </div>
                </section>

                <section class="order-2 lg:order-1 lg:col-span-8 flex flex-col gap-1.5 md:gap-6">
                    <div class="glass-card flex flex-col gap-2 md:gap-4 relative overflow-hidden">
                        <div class="flex items-center justify-between">
                            <h2 class="font-label-md text-xs md:text-sm uppercase tracking-widest text-primary flex items-center gap-1.5 font-bold">
                                <span class="material-symbols-outlined text-sm md:text-base">workspace_premium</span> TRÒ CHƠI THỬ THÁCH
                            </h2>
                            <div class="flex items-center gap-3 font-mono-data text-xs md:text-sm">
                                <span class="text-secondary">Điểm: <span id="challengeScore" class="font-bold text-primary">0</span></span>
                                <span class="text-on-surface-variant">Chuỗi: <span id="challengeStreak" class="font-bold text-secondary">0</span></span>
                            </div>
                        </div>

                        <div class="w-full h-44 md:h-64 flex items-center justify-center bg-black/40 border border-dashed border-primary/30 rounded-lg md:rounded-xl p-2">
                            <img id="challenge-sema-img" src="img_semaphore/ss.png" alt="Quiz Target" class="semaphore-img">
                        </div>

                        <div class="flex flex-col gap-1 mt-1">
                            <label class="text-[10px] md:text-xs font-label-md uppercase text-on-surface-variant font-bold">Đáp án của bạn:</label>
                            <div class="flex gap-2">
                                <input type="text" id="challengeInput" class="flex-1 bg-surface-container-highest border border-white/10 rounded-lg px-3 py-1.5 text-sm md:text-lg text-primary focus:ring-1 focus:ring-primary outline-none font-medium" placeholder="Nhập từ dịch được tại đây..." autocomplete="off" spellcheck="false">
                                <button id="btnCheckAnswer" class="px-4 bg-primary text-background font-bold rounded-lg hover:brightness-110 active:scale-95 transition-all text-xs md:text-sm uppercase tracking-widest flex items-center gap-1">
                                    <span class="material-symbols-outlined text-xs md:text-sm font-bold">verified</span> KIỂM TRA
                                </button>
                            </div>
                        </div>

                        <div id="resultFeedback" class="hidden p-2.5 rounded-lg font-medium text-xs items-center gap-2 transition-all">
                            <span id="feedbackIcon" class="material-symbols-outlined text-base"></span>
                            <span id="feedbackText"></span>
                        </div>
                    </div>
                </section>
            </div>

        </div>
    </main>

    <script>
        const challengeSemaImg = document.getElementById('challenge-sema-img');
        const challengeInput = document.getElementById('challengeInput');
        const btnChallengeGenerate = document.getElementById('btnChallengeGenerate');
        const btnChallengePlay = document.getElementById('btnChallengePlay');
        const btnCheckAnswer = document.getElementById('btnCheckAnswer');
        const resultFeedback = document.getElementById('resultFeedback');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackText = document.getElementById('feedbackText');
        const challengeScore = document.getElementById('challengeScore');
        const challengeStreak = document.getElementById('challengeStreak');
        const challengeWordCountInput = document.getElementById('challengeWordCountInput');
        const challengeSpeedRange = document.getElementById('challengeSpeedRange');
        const challengeSpeedVal = document.getElementById('challengeSpeedVal');

        let isPlaying = false, stopRequested = false, realText = "";
        let gameScore = 0, gameStreak = 0;

        if(challengeSpeedRange && challengeSpeedVal) {
            challengeSpeedRange.oninput = () => {
                challengeSpeedVal.innerText = (challengeSpeedRange.value / 1000).toFixed(1) + 's';
            };
        }

        const telexMap = { 'à':'a','á':'a','ả':'a','ã':'a','ạ':'a','ằ':'aw','ắ':'aw','ẳ':'aw','ẵ':'aw','ặ':'aw','ầ':'aa','ấ':'aa','ẩ':'aa','ẫ':'aa','ậ':'aa','è':'e','é':'e','ẻ':'e','ẽ':'e','ẹ':'e','ề':'ee','ế':'ee','ể':'ee','ễ':'ee','ệ':'ee','ì':'i','í':'i','ỉ':'i','ĩ':'i','ị':'i','ò':'o','ó':'o','ỏ':'o','õ':'o','ọ':'o','ồ':'oo','ố':'oo','ổ':'oo','ỗ':'oo','ộ':'oo','ờ':'ow','ớ':'ow','ở':'ow','ỡ':'ow','ợ':'ow','ù':'u','ú':'u','ủ':'u','ũ':'u','ụ':'u','ừ':'uw','ứ':'uw','ử':'uw','ữ':'uw','ự':'uw','ỳ':'y','ý':'y','ỷ':'y','ỹ':'y','ỵ':'y','đ':'dd','â':'aa','ă':'aw','ê':'ee','ô':'oo','ơ':'ow','ư':'uw' };
        const toneMap = { 'á':'s','à':'f','ả':'r','ã':'x','ạ':'j','ắ':'s','ằ':'f','ẳ':'r','ẵ':'x','ặ':'j','ấ':'s','ầ':'f','ẩ':'r','ẫ':'x','ậ':'j','é':'s','è':'f','ẻ':'r','ẽ':'x','ẹ':'j','ế':'s','ề':'f','ể':'r','ễ':'x','ệ':'j','í':'s','ì':'f','ỉ':'r','ĩ':'x','ị':'j','ó':'s','ò':'f','ỏ':'r','õ':'x','ọ':'j','ồ':'f','ổ':'r','ỗ':'x','ộ':'j','ớ':'s','ờ':'f','ở':'r','ỡ':'x','ợ':'j','ú':'s','ù':'f','ủ':'r','ũ':'x','ụ':'j','ứ':'s','ừ':'f','ử':'r','ữ':'x','ự':'j','ý':'s','ỳ':'f','ỷ':'r','ỹ':'x','ỵ':'j' };

        function toTelexArray(str) {
            let result = []; const words = str.trim().toLowerCase().split(/\s+/);
            if(!str.trim()) return [];
            words.forEach((word, index) => {
                let newWordChars = [], tones = "";
                for (let char of word) {
                    if (telexMap[char]) newWordChars.push(...telexMap[char].split(''));
                    else if(/[a-z]/.test(char)) newWordChars.push(char);
                    if (toneMap[char]) tones += toneMap[char];
                }
                result.push(...newWordChars, ...tones.split(''));
                if (index < words.length - 1) result.push('SPACE');
            });
            return result;
        }

        async function generateChallengeRandomText() {
            try {
                const response = await fetch('random.txt?v=' + Math.random());
                const rawText = await response.text();
                const normalizedText = rawText.normalize('NFC');
                const cleanRaw = normalizedText.replace(/[0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?“”‘’"'\r\n\t«»„“]/g, ' ');
                const allWords = cleanRaw.split(/\s+/)
                    .map(w => w.trim())
                    .filter(w => w.length >= 2);

                if (allWords.length === 0) return "";
                
                const count = parseInt(challengeWordCountInput.value) || 3;
                let selected = [];
                for (let i = 0; i < count; i++) {
                    selected.push(allWords[Math.floor(Math.random() * allWords.length)]);
                }
                return selected.join(' ').toLowerCase();
            } catch (err) { 
                return ""; 
            }
        }

        async function playChallengeSignalSequence() {
            if (!realText.trim() || isPlaying) return;
            isPlaying = true;
            stopRequested = false;
            
            for(let i=0; i<3; i++) {
                if(stopRequested) break;
                challengeSemaImg.src = `img_semaphore/start.png`;
                await new Promise(r => setTimeout(r, 400));
                challengeSemaImg.src = `img_semaphore/ss.png`;
                await new Promise(r => setTimeout(r, 200));
            }

            if (!stopRequested) {
                challengeSemaImg.src = `img_semaphore/ss.png`;
                await new Promise(r => setTimeout(r, 600));
            }

            const sequence = toTelexArray(realText);
            for (let char of sequence) {
                if (stopRequested) break;
                challengeSemaImg.src = `img_semaphore/${char === 'SPACE' ? 'ss' : char.toLowerCase()}.png`;
                await new Promise(r => setTimeout(r, parseInt(challengeSpeedRange.value)));
                
                challengeSemaImg.style.opacity = "0.8"; 
                await new Promise(r => setTimeout(r, 20)); 
                challengeSemaImg.style.opacity = "1";
            }

            for(let i=0; i<2; i++) {
                if(stopRequested) break;
                challengeSemaImg.src = `img_semaphore/start.png`;
                await new Promise(r => setTimeout(r, 400));
                challengeSemaImg.src = `img_semaphore/ss.png`;
                await new Promise(r => setTimeout(r, 200));
            }

            isPlaying = false;
            challengeSemaImg.src = `img_semaphore/ss.png`;
        }

        btnChallengeGenerate.onclick = async () => {
            stopRequested = true; 
            await new Promise(r => setTimeout(r, 100));

            if(resultFeedback) resultFeedback.classList.add('hidden');
            if(challengeInput) challengeInput.value = "";
            
            const txt = await generateChallengeRandomText();
            if(txt) {
                realText = txt;
                playChallengeSignalSequence();
            }
        };

        btnChallengePlay.onclick = () => {
            if(!isPlaying) playChallengeSignalSequence();
        };

        function verifyChallenge() {
            const userAnswer = challengeInput.value.trim().toLowerCase();
            const correctAnswer = realText.trim().toLowerCase();
            if(!correctAnswer) return;

            resultFeedback.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');

            if(userAnswer === correctAnswer) {
                gameScore += 10; gameStreak += 1;
                resultFeedback.classList.add('flex', 'bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
                feedbackIcon.textContent = "check_circle";
                feedbackText.textContent = "CHÍNH XÁC! Giải dịch Semaphore xuất sắc.";
            } else {
                gameStreak = 0;
                resultFeedback.classList.add('flex', 'bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
                feedbackIcon.textContent = "cancel";
                feedbackText.textContent = "CHƯA ĐÚNG! Nhấp nút Phát Lại để nhìn rõ hướng cờ.";
            }
            challengeScore.textContent = gameScore;
            challengeStreak.textContent = gameStreak;
        }

        if(btnCheckAnswer) btnCheckAnswer.onclick = verifyChallenge;
        challengeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.preventDefault(); verifyChallenge(); } });

        const menuToggle = document.getElementById('menuToggle');
        const overlay = document.getElementById('menuOverlay');
        
        menuToggle.onclick = (e) => { 
            document.body.classList.add('menu-open'); 
            overlay.classList.remove('hidden'); 
            e.stopPropagation(); 
        };
        overlay.onclick = () => { 
            document.body.classList.remove('menu-open'); 
            overlay.classList.add('hidden'); 
        };
    </script>
    <script src="script_security.js"></script>
    <script src="nav.js"></script>
</body>
</html>
